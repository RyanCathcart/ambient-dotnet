name: "Deploy to NuGet"

on:
  push:
    tags:
      - "v*"

env:
  PROJECT_PATH: "AmbientDotNet/AmbientDotNet.csproj"
  PACKAGE_OUTPUT_DIR: ${{ github.workspace }}\output
  NUGET_SOURCE_URL: "https://api.nuget.org/v3/index.json"

jobs:
  build-and-publish:
    name: "Build and Publish"
    runs-on: "ubuntu-latest"
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      
      - name: "Install .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: "Restore Packages"
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: "Build Project"
        run: dotnet build ${{ env.PROJECT_PATH }} --no-restore -c Release

      - name: "Get Tag"
        id: tag
        uses: dawidd6/action-get-tag@v1
        with:
          strip_v: true

      - name: "Pack Project"
        run: dotnet pack ${{ env.PROJECT_PATH }} --no-restore --no-build -c Release -p:PackageVersion=${{ steps.tag.outputs.tag }} -o ${{ env.PACKAGE_OUTPUT_DIR }}

       # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: "Push NuGet Package"
        run: dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg -k ${{steps.login.outputs.NUGET_API_KEY}} -s ${{env.NUGET_SOURCE_URL }}
